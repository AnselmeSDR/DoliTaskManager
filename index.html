<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>Popup</title>
    <style>
        html, body, #root {
            margin: 0;
            padding: 0;
            width: 400px;
            height: 600px;
            overflow: hidden;
        }

        /* Embedded in Jira (index.html?embed=task&ref=KEY) */
        html.embed, html.embed body, html.embed #root {
            width: auto;
            height: auto;
            background: transparent;
        }
    </style>

</head>
<body>
<div id="root"></div>
<script type="module" src="/src/popup.jsx"></script>
</body>
</html>
